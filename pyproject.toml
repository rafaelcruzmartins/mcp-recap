[project]
name = "mcp-recap"
version = "0.1.0"
description = "Servidor MCP (STDIO) para Autodesk ReCap no Windows: diagnóstico da instalação, leitura de metadados RCP/RCS e importação via DeCap.exe."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rafael Cruz" }]
dependencies = [
    "mcp>=1.20,<2",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
mcp-recap = "recap_mcp.__main__:main"
mcp-recap-configurar = "recap_mcp.client_config:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exige Autodesk ReCap instalado e licenciado; rode com RECAP_MCP_INTEGRATION=1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
